name: Deployments

on:
  push:
    tags:
      - "*"

jobs:
  apply-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Rutger505-Org/kubernetes-infrastructure
          path: infrastructure

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Setup Kubernetes
        uses: ./infrastructure/.github/actions/setup-kubernetes
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Test tailscale
        run: |
          tailscale status


      - name: OpenTofu Apply Cert Manager
        working-directory: ./0-cert-manager
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply Cluster Issuers
        working-directory: ./1-cluster-issuers
        env:
          TF_VAR_cert_email: ${{ vars.CERT_EMAIL }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply MetalLB
        working-directory: ./2-metallb
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply MetalLB Config
        working-directory: ./3-metallb-config
        env:
          TF_VAR_ip_addresses: ${{ vars.METALLB_IP_ADDRESSES }}
          TF_VAR_traefik_ip: ${{ vars.TRAEFIK_IP }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply RBAC
        working-directory: ./4-rbac
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply MinIO
        working-directory: ./5-minio
        env:
          TF_VAR_root_user: ${{ secrets.MINIO_ROOT_USER }}
          TF_VAR_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
          TF_VAR_cdn_hostname: ${{ vars.MINIO_CDN_HOSTNAME }}
          TF_VAR_console_hostname: ${{ vars.MINIO_CONSOLE_HOSTNAME }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply Pi-hole
        working-directory: ./6-pihole
        env:
          TF_VAR_dns_ip: ${{ vars.PIHOLE_DNS_IP }}
          TF_VAR_web_ip: ${{ vars.PIHOLE_WEB_IP }}
          TF_VAR_web_password: ${{ secrets.PIHOLE_WEB_PASSWORD }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      # Tears down the Minecraft stack: helm releases, namespace, PVC and world
      # data. Remove this step and the 7-minecraft directory once a tag has run
      # it and the namespace is gone.
      - name: OpenTofu Destroy Minecraft
        working-directory: ./7-minecraft
        env:
          TF_VAR_router_ip: ${{ vars.MINECRAFT_ROUTER_IP }}
          TF_VAR_hostname: ${{ vars.MINECRAFT_HOSTNAME }}
          TF_VAR_server_type: ${{ vars.MINECRAFT_SERVER_TYPE }}
          TF_VAR_idle_shutdown_after: ${{ vars.MINECRAFT_IDLE_SHUTDOWN_AFTER }}
          TF_VAR_curseforge_slug: ${{ vars.MINECRAFT_CURSEFORGE_SLUG }}
        run: |
          tofu init
          tofu destroy -input=false -auto-approve

