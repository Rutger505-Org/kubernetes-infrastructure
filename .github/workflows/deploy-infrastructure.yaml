name: Deployments

on:
  push:
    branches:
      - main
  # Re-applies every module, e.g. to undo manual changes in the cluster.
  workflow_dispatch:

# Queue instead of cancel: aborting a running apply can leave a module's state lock held.
concurrency:
  group: deploy-infrastructure
  cancel-in-progress: false

jobs:
  apply-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Rutger505-Org/kubernetes-infrastructure
          path: infrastructure

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Setup Kubernetes
        uses: ./infrastructure/.github/actions/setup-kubernetes
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Test tailscale
        run: |
          tailscale status


      - name: OpenTofu Apply Cert Manager
        working-directory: ./0-cert-manager
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply Cluster Issuers
        working-directory: ./1-cluster-issuers
        env:
          TF_VAR_cert_email: ${{ vars.CERT_EMAIL }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply MetalLB
        working-directory: ./2-metallb
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply MetalLB Config
        working-directory: ./3-metallb-config
        env:
          TF_VAR_ip_addresses: ${{ vars.METALLB_IP_ADDRESSES }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply RBAC
        working-directory: ./4-rbac
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply SeaweedFS
        working-directory: ./5-seaweedfs
        env:
          TF_VAR_cdn_hostname: ${{ vars.CDN_HOSTNAME }}
          TF_VAR_seaweedfs_ip: ${{ vars.SEAWEEDFS_IP }}
        run: |
          tofu init
          # The provider errors on a deleted EndpointSlice instead of recreating it.
          if ! kubectl -n seaweedfs get endpointslice seaweedfs-s3-vm >/dev/null 2>&1; then
            tofu state rm kubernetes_endpoint_slice_v1.s3 || true
          fi
          tofu apply -input=false -auto-approve

      # Traefik (HTTP/3, LoadBalancer IP) is configured by homelab-infrastructure's
      # k3s role now. The HelmChartConfig must stay, so this only forgets the old
      # 6-traefik-http3 state instead of running tofu destroy. Remove this step once
      # it has run.
      - name: Forget Traefik HTTP/3 state
        run: |
          kubectl -n default delete secret tfstate-default-traefik-http3 --ignore-not-found
          kubectl -n default delete lease lock-tfstate-default-traefik-http3 --ignore-not-found

      - name: OpenTofu Apply Monitoring
        working-directory: ./7-monitoring
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_proxmox_token_value: ${{ secrets.PROXMOX_TOKEN_VALUE }}
          TF_VAR_openclaw_gateway_token: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply Pulse
        working-directory: ./8-pulse
        env:
          TF_VAR_pulse_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_proxmox_token_value: ${{ secrets.PROXMOX_TOKEN_VALUE }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve
