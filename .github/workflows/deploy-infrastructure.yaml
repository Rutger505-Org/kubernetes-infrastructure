name: Deployments

on:
  push:
    branches:
      - main

# Queue instead of cancel: aborting a running apply can leave a module's state lock held.
concurrency:
  group: deploy-infrastructure
  cancel-in-progress: false

jobs:
  apply-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Rutger505-Org/kubernetes-infrastructure
          path: infrastructure

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Setup Kubernetes
        uses: ./infrastructure/.github/actions/setup-kubernetes
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Test tailscale
        run: |
          tailscale status


      - name: OpenTofu Apply Cert Manager
        working-directory: ./0-cert-manager
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply Cluster Issuers
        working-directory: ./1-cluster-issuers
        env:
          TF_VAR_cert_email: ${{ vars.CERT_EMAIL }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply MetalLB
        working-directory: ./2-metallb
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply MetalLB Config
        working-directory: ./3-metallb-config
        env:
          TF_VAR_ip_addresses: ${{ vars.METALLB_IP_ADDRESSES }}
          TF_VAR_traefik_ip: ${{ vars.TRAEFIK_IP }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply RBAC
        working-directory: ./4-rbac
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      # Teardown: MinIO is being replaced by SeaweedFS. Destroys the release and its
      # PVC (all data), then the namespace (helm leaves it and the stuck post-job
      # hook behind) and the now-empty state secret. Idempotent on re-runs.
      - name: OpenTofu Destroy MinIO
        working-directory: ./5-minio
        env:
          TF_VAR_root_user: ${{ secrets.MINIO_ROOT_USER }}
          TF_VAR_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
          TF_VAR_cdn_hostname: ${{ vars.MINIO_CDN_HOSTNAME }}
          TF_VAR_console_hostname: ${{ vars.MINIO_CONSOLE_HOSTNAME }}
        run: |
          tofu init
          tofu destroy -input=false -auto-approve
          kubectl delete namespace minio --ignore-not-found --wait --timeout=5m
          kubectl delete secret tfstate-default-minio -n default --ignore-not-found

      - name: OpenTofu Apply Traefik HTTP/3
        working-directory: ./6-traefik-http3
        env:
          TF_VAR_traefik_ip: ${{ vars.TRAEFIK_IP }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve

      - name: OpenTofu Apply Monitoring
        working-directory: ./7-monitoring
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_grafana_hostname: ${{ vars.GRAFANA_HOSTNAME }}
          TF_VAR_proxmox_token_value: ${{ secrets.PROXMOX_TOKEN_VALUE }}
          TF_VAR_openclaw_gateway_token: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          tofu init
          tofu apply -input=false -auto-approve



