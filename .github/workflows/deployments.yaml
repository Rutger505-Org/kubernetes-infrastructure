name: Deployments

on:
  workflow_call:
    secrets:
      KUBECONFIG:
        required: true
      TAILSCALE_OAUTH_CLIENT_ID:
        required: true
      TAILSCALE_OAUTH_SECRET:
        required: true
      DOCKERHUB_TOKEN:
        required: true

# Serialize deploy/destroy per environment so a still-running deploy and the
# destroy triggered by merging/closing the PR never race on the same OpenTofu
# state lock (kubernetes backend locks per workspace: pr-<n> / production).
concurrency:
  group: deploy-${{ github.repository }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  configure:
    name: Generate Configuration
    runs-on: ubuntu-latest
    outputs:
      application_name: ${{ steps.config.outputs.application_name }}
      environment: ${{ steps.config.outputs.environment }}
      is_production: ${{ steps.config.outputs.is_production }}
      image: ${{ steps.config.outputs.image }}
      hostname: ${{ steps.config.outputs.hostname }}
      certificate_issuer: ${{ steps.config.outputs.certificate_issuer }}

    steps:
      - name: Configuration
        id: config
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          missing=()
          [ -z "${APPLICATION_NAME:-}" ] && missing+=(APPLICATION_NAME)
          [ -z "${DOCKERHUB_USERNAME:-}" ] && missing+=(DOCKERHUB_USERNAME)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required environment variables: ${missing[*]}"
            exit 1
          fi

          # On a pull_request "closed" event GitHub sets github.ref to the base
          # branch (refs/heads/main), not a PR ref, so this must also require
          # the push event or a merged PR gets misclassified as production.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            environment=production
            is_production=true
            hostname="$BASE_DOMAIN"
            certificate_issuer=letsencrypt-production
          else
            environment="pr-${PR_NUMBER}"
            is_production=false
            hostname="${{ github.sha }}.$BASE_DOMAIN"
            certificate_issuer=letsencrypt-staging
          fi

          image="$DOCKERHUB_USERNAME/$APPLICATION_NAME:${{ github.sha }}"

          {
            echo "application_name=$APPLICATION_NAME"
            echo "environment=$environment"
            echo "is_production=$is_production"
            echo "image=$image"
            echo "hostname=$hostname"
            echo "certificate_issuer=$certificate_issuer"
          } >>"$GITHUB_OUTPUT"

          {
            echo "# Deployment Configuration 🚀"
            echo "| Parameter | Value |"
            echo "| - | - |"
            echo "| application_name | $APPLICATION_NAME |"
            echo "| environment | $environment |"
            echo "| is_production | $is_production |"
            echo "| image | $image |"
            echo "| hostname | $hostname |"
            echo "| certificate_issuer | $certificate_issuer |"
          } >>"$GITHUB_STEP_SUMMARY"

  build-docker-image:
    if: github.event.action != 'closed'
    name: Build Docker image
    needs: [configure]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ needs.configure.outputs.image }}
          cache-from: |
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=development
            type=gha,scope=main
          cache-to: |
            type=gha,mode=max,scope=${{ github.ref_name }}
            ${{ startsWith(github.ref, 'refs/tags/') && 'type=gha,mode=max,scope=main' || '' }}

  deploy-to-kubernetes:
    if: github.event.action != 'closed'
    name: Deploy to Kubernetes
    needs: [configure, build-docker-image]
    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.configure.outputs.environment }}
      url: https://${{ needs.configure.outputs.hostname }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Rutger505-Org/kubernetes-infrastructure
          path: infrastructure

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Kubernetes
        uses: ./infrastructure/.github/actions/setup-kubernetes
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Generate deployment environment variables
        id: env
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          # Pick out DEPLOYMENT_-prefixed vars/secrets and strip the prefix,
          # e.g. DEPLOYMENT_AUTH_EMAIL_FROM -> AUTH_EMAIL_FROM.
          vars_json=$(jq -c 'with_entries(select(.key | startswith("DEPLOYMENT_")) | .key |= sub("^DEPLOYMENT_"; ""))' <<<"$VARS")
          secrets_json=$(jq -c 'with_entries(select(.key | startswith("DEPLOYMENT_")) | .key |= sub("^DEPLOYMENT_"; ""))' <<<"$SECRETS")

          echo "vars=$vars_json" >>"$GITHUB_OUTPUT"
          echo "secrets=$secrets_json" >>"$GITHUB_OUTPUT"

      - name: OpenTofu Apply
        working-directory: ./deploy
        env:
          TF_VAR_application_name: ${{ needs.configure.outputs.application_name }}
          TF_VAR_image: ${{ needs.configure.outputs.image }}
          TF_VAR_hostname: ${{ needs.configure.outputs.hostname }}
          TF_VAR_certificate_issuer: ${{ needs.configure.outputs.certificate_issuer }}
          TF_VAR_config: ${{ steps.env.outputs.vars }}
          TF_VAR_secrets: ${{ steps.env.outputs.secrets }}
        run: |
          tofu init
          tofu workspace select -or-create ${{ needs.configure.outputs.environment }}
          tofu apply -input=false -auto-approve

  destroy-pr-environment:
    if: github.event.action == 'closed'
      && needs.configure.outputs.is_production == 'false'
      && contains(needs.configure.outputs.environment, 'pr-')
    name: Destroy PR Environment
    needs: [configure]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.configure.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Rutger505-Org/kubernetes-infrastructure
          path: infrastructure

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Kubernetes
        uses: ./infrastructure/.github/actions/setup-kubernetes
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: OpenTofu Destroy
        working-directory: ./deploy
        env:
          TF_VAR_application_name: ${{ needs.configure.outputs.application_name }}
          TF_VAR_image: ${{ needs.configure.outputs.image }}
          TF_VAR_hostname: ${{ needs.configure.outputs.hostname }}
          TF_VAR_certificate_issuer: ${{ needs.configure.outputs.certificate_issuer }}
        run: |
          tofu init
          tofu workspace select ${{ needs.configure.outputs.environment }} || exit 0
          tofu apply -input=false -auto-approve -destroy
          tofu workspace select default
          tofu workspace delete ${{ needs.configure.outputs.environment }}
