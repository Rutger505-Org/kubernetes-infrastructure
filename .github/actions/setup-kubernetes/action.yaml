name: "Setup Kubernetes"
description: "Sets up Kubernetes configuration and OpenTofu"

inputs:
  kubeconfig:
    description: "Kubeconfig for cluster access"
    required: true
  tofu-version:
    description: "Version of OpenTofu to install"
    required: false
    default: "1.9.0"

runs:
  using: composite
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: ${{ inputs.tofu-version }}
        tofu_wrapper: "false"

    - name: Configure OpenTofu provider cache
      shell: bash
      run: |
        mkdir -p ~/.terraform.d/plugin-cache
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

    - name: Cache OpenTofu providers
      uses: actions/cache@v4
      with:
        path: ~/.terraform.d/plugin-cache
        key: tofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          tofu-providers-${{ runner.os }}-

    - name: Configure Kubeconfig
      uses: ./infrastructure/.github/actions/with-post-step
      with:
        main: |
          echo "Creating setting kubeconfig in ~/.kube/config"
          mkdir -p ~/.kube
          echo "${{ inputs.kubeconfig }}" > ~/.kube/config
          chmod 600 ~/.kube/config
        post: |
          echo "Cleaning up kubeconfig"
          rm -f ~/.kube/config
